<div class="layout">
  <ng-ribbon [settings]="ribbonSettings">

    <ng-ribbon-context #mainContext>

      <ng-ribbon-tab name="Accueil" [active]="true" [order]="1">

        <ng-ribbon-group name="Presse-papiers" [dialogLauncher]="true" (showDialog)="openGroupDialog('Presse-papiers')">
          <div class="ribbon-toolbar">
            <button class="ribbon-button large" (click)="onAction('Coller')" title="Coller (Ctrl+V)">
              <span class="icon">📋</span>
              <span class="label">Coller</span>
            </button>
            <div class="column">
              <button class="ribbon-button small" (click)="onAction('Couper')" title="Couper la sélection (Ctrl+X)">✂️ Couper</button>
              <button class="ribbon-button small" (click)="onAction('Copier')" title="Copier la sélection (Ctrl+C)">📄 Copier</button>
              <button class="ribbon-button small" (click)="onAction('Reproduire Format')" title="Reproduire la mise en forme">🖌️ Repr. Format</button>
            </div>
          </div>
        </ng-ribbon-group>

        <ng-ribbon-group name="Police">
          <div class="ribbon-toolbar">
            <div class="column">
              <div class="row">
                <select style="width: 120px;" title="Police du texte">
                  <option>Arial</option>
                  <option>Calibri</option>
                  <option>Times New Roman</option>
                </select>
                <select style="width: 50px;" title="Taille de la police">
                  <option>11</option>
                  <option>12</option>
                  <option>14</option>
                </select>
              </div>
              <div class="row button-group">
                <button class="ribbon-button tiny" (click)="onAction('Gras')" title="Gras (Ctrl+G)"><b>G</b></button>
                <button class="ribbon-button tiny" (click)="onAction('Italique')" title="Italique (Ctrl+I)"><i>I</i></button>
                <button class="ribbon-button tiny" (click)="onAction('Souligné')" title="Souligné (Ctrl+S)"><u>S</u></button>
                <button class="ribbon-button tiny" (click)="onAction('Barré')" title="Barrer le texte">~~</button>
                <div style="width: 2px; height: 20px; background-color: #ccc; margin: 0 4px;"></div>
                
                <app-split-button
                  title="Couleur de fond"
                  (mainBtnClick)="onAction('Couleur Fond: ' + backColor)"
                  [dropDownMenu]="bgColorMenu">
                  <mat-icon svgIcon="highlight-bg-color"></mat-icon>
                  <div class="color-preview" [style.background]="backColor"></div>
                  <ng-template #bgColorMenu>
                    <color-sketch style="width: 220px"
                                  [color]="backColor"
                                  (onChangeComplete)="backColor = $event.color.hex; onAction('Couleur Fond: ' + backColor)"></color-sketch>
                  </ng-template>
                </app-split-button>
                
                <app-split-button
                  title="Couleur de police"
                  (mainBtnClick)="onAction('Couleur Texte: ' + foreColor)"
                  [dropDownMenu]="foreColorMenu">
                  <mat-icon svgIcon="text-color"></mat-icon>
                  <div class="color-preview" [style.background]="foreColor"></div>
                  <ng-template #foreColorMenu>
                    <color-sketch style="width: 220px"
                                  [color]="foreColor"
                                  (onChangeComplete)="foreColor = $event.color.hex; onAction('Couleur Texte: ' + foreColor)"></color-sketch>
                  </ng-template>
                </app-split-button>
              </div>
            </div>
          </div>
        </ng-ribbon-group>

        <ng-ribbon-group name="Paragraphe" [dialogLauncher]="true" (showDialog)="openGroupDialog('Paragraphe')">
          <div class="ribbon-toolbar column" style="height: 100%; justify-content: space-evenly;">
            <div class="row button-group">
              <button class="ribbon-button tiny" (click)="onAction('Aligner Gauche')" title="Aligner le texte à gauche">◀</button>
              <button class="ribbon-button tiny" (click)="onAction('Centrer')" title="Centrer le texte">≡</button>
              <button class="ribbon-button tiny" (click)="onAction('Aligner Droite')" title="Aligner le texte à droite">▶</button>
              <button class="ribbon-button tiny" (click)="onAction('Justifier')" title="Justifier le texte">⁚</button>
            </div>
            <div class="row button-group">
              <button class="ribbon-button small" (click)="onAction('Puces')" title="Liste à puces">
                <svg width="16" height="16" viewBox="0 0 24 24" style="fill: #333; margin-right: 4px;"><path d="M11 5h8c.6 0 1 .4 1 1s-.4 1-1 1h-8a1 1 0 0 1 0-2zm0 6h8c.6 0 1 .4 1 1s-.4 1-1 1h-8a1 1 0 0 1 0-2zm0 6h8c.6 0 1 .4 1 1s-.4 1-1 1h-8a1 1 0 0 1 0-2zM4.5 6c0-.4.1-.8.4-1 .3-.4.7-.5 1.1-.5.4 0 .8.1 1 .4.4.3.5.7.5 1.1 0 .4-.1.8-.4 1-.3.4-.7.5-1.1.5-.4 0-.8-.1-1-.4-.4-.3-.5-.7-.5-1.1zm0 6c0-.4.1-.8.4-1 .3-.4.7-.5 1.1-.5.4 0 .8.1 1 .4.4.3.5.7.5 1.1 0 .4-.1.8-.4 1-.3.4-.7.5-1.1.5-.4 0-.8-.1-1-.4-.4-.3-.5-.7-.5-1.1zm0 6c0-.4.1-.8.4-1 .3-.4.7-.5 1.1-.5.4 0 .8.1 1 .4.4.3.5.7.5 1.1 0 .4-.1.8-.4 1-.3.4-.7.5-1.1.5-.4 0-.8-.1-1-.4-.4-.3-.5-.7-.5-1.1z" fill-rule="evenodd"/></svg>
                À puces
              </button>
              <button class="ribbon-button small" (click)="onAction('Numérotation')" title="Numérotation">
                <svg width="16" height="16" viewBox="0 0 24 24" style="fill: #333; margin-right: 4px;"><path d="M10 17h8c.6 0 1 .4 1 1s-.4 1-1 1h-8a1 1 0 0 1 0-2zm0-6h8c.6 0 1 .4 1 1s-.4 1-1 1h-8a1 1 0 0 1 0-2zm0-6h8c.6 0 1 .4 1 1s-.4 1-1 1h-8a1 1 0 1 1 0-2zM6 4v3.5c0 .3-.2.5-.5.5a.5.5 0 0 1-.5-.5V5h-.5a.5.5 0 0 1 0-1H6zm-1 8.8l.2.2h1.3c.3 0 .5.2.5.5s-.2.5-.5.5H4.9a1 1 0 0 1-.9-1V13c0-.4.3-.8.6-1l1.2-.4.2-.3a.2.2 0 0 0-.2-.2H4.5a.5.5 0 0 1-.5-.5c0-.3.2-.5.5-.5h1.6c.5 0 .9.4.9 1v.1c0 .4-.3.8-.6 1l-1.2.4-.2.3zM7 17v2c0 .6-.4 1-1 1H4.5a.5.5 0 0 1 0-1h1.2c.2 0 .3-.1.3-.3 0-.2-.1-.3-.3-.3H4.4a.4.4 0 1 1 0-.8h1.3c.2 0 .3-.1.3-.3 0-.2-.1-.3-.3-.3H4.5a.5.5 0 1 1 0-1H6c.6 0 1 .4 1 1z" fill-rule="evenodd"/></svg>
                Numérotée
              </button>
            </div>
          </div>
        </ng-ribbon-group>

      </ng-ribbon-tab>

      <ng-ribbon-tab name="Insertion" [order]="2">
        <ng-ribbon-group name="Pages">
          <div class="ribbon-toolbar column" style="height: 100%; justify-content: space-evenly;">
            <button class="ribbon-button large" (click)="onAction('Page Garde')" title="Insérer une page de garde">
              <span class="icon">📄</span>
              <span class="label">Page de Garde</span>
            </button>
          </div>
        </ng-ribbon-group>

        <ng-ribbon-group name="Tableaux">
          <button class="ribbon-button large" (click)="onAction('Insérer Tableau')" title="Insérer un tableau">
            <span class="icon">📅</span>
            <span class="label">Tableau</span>
          </button>
        </ng-ribbon-group>

        <ng-ribbon-group name="Illustrations">
          <button class="ribbon-button large" (click)="onAction('Images')" title="Insérer une image à partir de l'ordinateur">
            <span class="icon">🖼️</span>
            <span class="label">Images</span>
          </button>
          <button class="ribbon-button large" (click)="onAction('Formes')" title="Dessiner des formes">
            <span class="icon">🔶</span>
            <span class="label">Formes</span>
          </button>
        </ng-ribbon-group>

        <ng-ribbon-group name="En-têtes et Pieds de page">
          <div class="ribbon-toolbar column" style="height: 100%; justify-content: space-evenly;">
            <button class="ribbon-button small" (click)="onAction('En-tête')" title="Ajouter un en-tête">H En-tête</button>
            <button class="ribbon-button small" (click)="onAction('Pied de page')" title="Ajouter un pied de page">F Pied de page</button>
            <button class="ribbon-button small" (click)="onAction('Numéro de Page')" title="Insérer un numéro de page"># Num. Page</button>
          </div>
        </ng-ribbon-group>

        <ng-ribbon-group name="Symboles">
          <app-symbol-list (symbolSelected)="onAction('Symbole: ' + $event)"></app-symbol-list>
        </ng-ribbon-group>

      </ng-ribbon-tab>

      <ng-ribbon-tab name="Mise en page" [order]="3">

        <ng-ribbon-group name="Mise en page" [dialogLauncher]="true" (showDialog)="openGroupDialog('Mise en page')">
          <div class="ribbon-toolbar column" style="height: 100%; justify-content: space-evenly;">
            <button class="ribbon-button large" (click)="onAction('Marges')" title="Définir les marges du document">
              <span class="icon">📐</span>
              <span class="label">Marges</span>
            </button>
            <button class="ribbon-button large" (click)="onAction('Orientation')" title="Changer l'orientation de la page (Portrait/Paysage)">
              <span class="icon">🔄</span>
              <span class="label">Orientation</span>
            </button>
          </div>
        </ng-ribbon-group>

        <ng-ribbon-group name="Arrière-plan de la page">
          <button class="ribbon-button large" (click)="onAction('Filigrane')" title="Ajouter un filigrane">
            <span class="icon">💧</span>
            <span class="label">Filigrane</span>
          </button>
          <button class="ribbon-button large" (click)="onAction('Couleur Page')" title="Changer la couleur d'arrière-plan de la page">
            <span class="icon">🎨</span>
            <span class="label">Couleur Page</span>
          </button>
        </ng-ribbon-group>

      </ng-ribbon-tab>

      <ng-ribbon-tab name="Révision" [order]="4">

        <ng-ribbon-group name="Vérification">
          <button class="ribbon-button large" (click)="onAction('Orthographe')" title="Vérifier l'orthographe et la grammaire">
            <span class="icon">ABC</span>
            <span class="label">Orthographe</span>
          </button>
        </ng-ribbon-group>

        <ng-ribbon-group name="Commentaires">
          <button class="ribbon-button large" (click)="onAction('Nouveau Commentaire')" title="Ajouter un nouveau commentaire">
            <span class="icon">💬</span>
            <span class="label">Nouv. Com.</span>
          </button>
          <button class="ribbon-button large" (click)="onAction('Supprimer Commentaire')" title="Supprimer un commentaire">
            <span class="icon">🗑️</span>
            <span class="label">Suppr. Com.</span>
          </button>
        </ng-ribbon-group>

        <ng-ribbon-group name="Protéger">
          <button class="ribbon-button large" (click)="onAction('Restreindre Modification')" title="Protéger le document">
            <span class="icon">🔒</span>
            <span class="label">Restreindre</span>
          </button>
        </ng-ribbon-group>

      </ng-ribbon-tab>

    </ng-ribbon-context>
  </ng-ribbon>

  <div class="content-placeholder" style="flex-grow: 1;">
  </div>
</div>
